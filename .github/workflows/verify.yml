name: Verify research artifact
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-and-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build strict portable core
        run: ./scripts/build.sh
      - name: Independent exact integer-oracle and integrity checks
        run: ./scripts/test.sh
      - name: Reproduce all 230 frozen comparisons
        run: |
          python3 analysis/reproduce.py
          cmp analysis/generated/lattice_summary.csv evidence/original/results/lattice_summary.csv
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install elan from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y elan
      - name: Fetch pinned toolchain and mathlib cache
        working-directory: lean
        run: |
          elan toolchain install leanprover/lean4:v4.24.0
          lake exe cache get
      - name: Build and inspect theorem assumptions
        working-directory: lean
        run: |
          lake build
          set -o pipefail
          lake env lean evidence/Inspect.lean | tee evidence/ci-types-and-axioms.txt
          python3 ../scripts/check_lean_axioms.py evidence/ci-types-and-axioms.txt
  manuscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
      - name: Compile manuscript and bibliography
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          bibtex paper
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
